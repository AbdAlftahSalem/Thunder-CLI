name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: stable
      - run: dart pub get
      - run: dart format --output=none --set-exit-if-changed lib bin test
      - run: dart analyze --fatal-infos
      - run: dart test
      - run: dart pub publish --dry-run

  e2e:
    name: End to end (${{ matrix.state }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        state: [getx, bloc, cubit]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: ./tool/e2e.sh ${{ matrix.state }}
